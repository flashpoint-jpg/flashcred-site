<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Melhor Lance Ganha | FlashCred</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
body{font-family:Inter,system-ui,-apple-system,sans-serif;background:radial-gradient(circle at 8% 8%,rgba(15,139,141,.10),transparent 28%),radial-gradient(circle at 92% 22%,rgba(16,185,129,.09),transparent 25%),linear-gradient(180deg,#f8fbff 0%,#f8fafc 55%,#eef4fb 100%);color:#1e293b;line-height:1.6;min-height:100vh;margin:0}
.card{background:#fff;border-radius:24px;box-shadow:0 10px 40px rgba(10,36,99,.08)}
.input{width:100%;padding:13px 14px;border:1.5px solid #e2e8f0;border-radius:12px;font-size:15px;box-sizing:border-box;margin-bottom:14px}
.input:focus{outline:none;border-color:#0A2463}
@keyframes pulseLive{0%,100%{opacity:1}50%{opacity:.5}}
.bolinha-live{width:8px;height:8px;border-radius:50%;background:#DC2626;display:inline-block;animation:pulseLive 1.2s infinite}
@keyframes fadeInUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.lance-item{animation:fadeInUp .35s ease}
</style>
</head>
<body>

<nav style="background:rgba(255,255,255,.9);backdrop-filter:blur(14px);border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:20">
  <div class="max-w-3xl mx-auto px-4 py-4 flex justify-between items-center">
    <a href="index.html" style="font-weight:900;font-size:22px;background:linear-gradient(90deg,#0A2463,#0F8B8D);-webkit-background-clip:text;background-clip:text;color:transparent;text-decoration:none">FlashCred</a>
    <a href="index.html" style="font-size:13px;font-weight:700;color:#64748b;text-decoration:none">← Voltar ao site</a>
  </div>
</nav>

<main class="max-w-3xl mx-auto px-4 py-8">

  <div id="conteudo" class="card" style="padding:30px 22px;text-align:center">
    <div style="font-size:15px;color:#64748b">Carregando leilão...</div>
  </div>

</main>

<script>
const SUPABASE_URL='https://rgcclordmqjmwuzrrfbd.supabase.co';
const SUPABASE_KEY='sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';
let supabase=null;
function inicializarSupabase(){
  if(supabase) return supabase;
  try{
    if(window.supabase && window.supabase.createClient){
      supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
    }
  }catch(e){console.error('Erro ao iniciar Supabase:',e)}
  return supabase;
}
inicializarSupabase();

let leilaoAtual=null;
let lancesAtuais=[];
let intervaloAtualizacao=null;
let intervaloCronometro=null;

function moeda(v){
  return Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
}

function formatarTelefone(v){
  const n=v.replace(/\D/g,'').slice(0,11);
  if(n.length<=2) return n;
  if(n.length<=7) return `(${n.slice(0,2)}) ${n.slice(2)}`;
  return `(${n.slice(0,2)}) ${n.slice(2,7)}-${n.slice(7)}`;
}

async function carregarLeilao(){
  const cliente=inicializarSupabase();
  if(!cliente){
    setTimeout(carregarLeilao,500);
    return;
  }

  const { data: leiloes, error } = await cliente
    .from('leiloes')
    .select('*')
    .eq('ativo', true)
    .order('created_at', { ascending: false })
    .limit(1);

  if(error){
    document.getElementById('conteudo').innerHTML = `<div style="padding:20px;color:#DC2626">Erro ao carregar: ${error.message}</div>`;
    return;
  }

  if(!leiloes || !leiloes.length){
    document.getElementById('conteudo').innerHTML = `
      <div style="font-size:44px;margin-bottom:10px">🔨</div>
      <h2 style="font-weight:900;color:#0A2463;font-size:20px;margin-bottom:8px">Nenhum leilão ativo agora</h2>
      <p style="color:#64748b;font-size:14px">Fica de olho — em breve tem novidade por aqui!</p>
    `;
    return;
  }

  leilaoAtual = leiloes[0];

  const { data: lances } = await cliente
    .from('leilao_lances')
    .select('*')
    .eq('leilao_id', leilaoAtual.id)
    .order('valor', { ascending: false })
    .limit(10);

  lancesAtuais = lances || [];

  renderizar();

  if(!intervaloAtualizacao){
    intervaloAtualizacao = setInterval(carregarLeilao, 4000);
  }
}

let leilaoIdRenderizado = null;

function renderizar(){
  const agora = new Date();
  const fim = new Date(leilaoAtual.horario_fim);
  const encerrado = leilaoAtual.encerrado || agora >= fim;

  const maiorLance = lancesAtuais.length ? Number(lancesAtuais[0].valor) : Number(leilaoAtual.lance_minimo);
  const proximoLanceMinimo = lancesAtuais.length
    ? maiorLance + Number(leilaoAtual.incremento_minimo)
    : Number(leilaoAtual.lance_minimo);

  if(encerrado){
    const vencedor = lancesAtuais[0];
    document.getElementById('conteudo').innerHTML = `
      <div style="font-size:44px;margin-bottom:6px">🏆</div>
      <h2 style="font-weight:900;color:#0A2463;font-size:22px;margin-bottom:4px">Leilão encerrado!</h2>
      <p style="color:#64748b;font-size:14px;margin-bottom:20px">${escapeHTML(leilaoAtual.produto_nome)}</p>
      ${vencedor ? `
        <div style="background:#F0FDF4;border:1.5px solid #86EFAC;border-radius:16px;padding:20px;margin-bottom:16px">
          <p style="font-size:13px;color:#166534;font-weight:700;margin-bottom:4px">MAIOR LANCE</p>
          <p style="font-size:28px;font-weight:900;color:#15803D">R$ ${moeda(vencedor.valor)}</p>
          <p style="font-size:13px;color:#166534;margin-top:4px">${escapeHTML(mascararNome(vencedor.nome))}</p>
        </div>
        <p style="font-size:13px;color:#94a3b8">Se foi você quem ganhou, nossa equipe já vai te chamar no WhatsApp pra confirmar!</p>
      ` : `
        <p style="color:#94a3b8;font-size:14px">Ninguém deu lance a tempo desse leilão.</p>
      `}
    `;
    leilaoIdRenderizado = null;
    if(intervaloAtualizacao){ clearInterval(intervaloAtualizacao); intervaloAtualizacao=null; }
    if(intervaloCronometro){ clearInterval(intervaloCronometro); intervaloCronometro=null; }
    return;
  }

  // Já existe o formulário na tela pra esse mesmo leilão? Só atualiza os
  // números (maior lance, contagem, lista) sem recriar o formulário —
  // assim a pessoa não perde o que já digitou nem a tela "pisca".
  if(leilaoIdRenderizado === leilaoAtual.id){
    const elValor = document.getElementById('valorMaiorLance');
    const elQtd = document.getElementById('qtdLances');
    const elMinLabel = document.getElementById('labelLanceMinimo');
    const elInputValor = document.getElementById('lanceValor');
    const elLista = document.getElementById('listaUltimosLances');

    if(elValor) elValor.textContent = `R$ ${moeda(maiorLance)}`;
    if(elQtd) elQtd.textContent = `${lancesAtuais.length} lance(s) dado(s)`;
    if(elMinLabel) elMinLabel.textContent = `Seu lance (mínimo R$ ${moeda(proximoLanceMinimo)})`;
    if(elInputValor && document.activeElement !== elInputValor){
      elInputValor.placeholder = `R$ ${moeda(proximoLanceMinimo)}`;
      elInputValor.min = proximoLanceMinimo;
    }
    if(elLista){
      elLista.innerHTML = lancesAtuais.slice(0,6).map((l,idx) => `
        <div class="lance-item" style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:${idx===0?'#F0FDF4':'#F8FAFC'};border-radius:10px;border:1px solid ${idx===0?'#86EFAC':'#E2E8F0'}">
          <span style="font-size:13px;color:#334155">${idx===0?'🥇 ':''}${escapeHTML(mascararNome(l.nome))}</span>
          <strong style="font-size:13.5px;color:#0A2463">R$ ${moeda(l.valor)}</strong>
        </div>
      `).join('');
    }
    return;
  }

  leilaoIdRenderizado = leilaoAtual.id;

  document.getElementById('conteudo').innerHTML = `
    <div style="display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:14px">
      <span class="bolinha-live"></span>
      <span style="font-size:12px;font-weight:800;color:#DC2626;letter-spacing:.04em">AO VIVO</span>
    </div>

    ${leilaoAtual.produto_imagem_url ? `
      <img src="${escapeHTML(leilaoAtual.produto_imagem_url)}" alt="${escapeHTML(leilaoAtual.produto_nome)}" style="width:100%;max-height:260px;object-fit:cover;border-radius:16px;margin-bottom:16px">
    ` : ''}

    <h2 style="font-weight:900;color:#0A2463;font-size:22px;margin-bottom:4px">${escapeHTML(leilaoAtual.produto_nome)}</h2>
    ${leilaoAtual.descricao ? `<p style="color:#64748b;font-size:14px;margin-bottom:16px">${escapeHTML(leilaoAtual.descricao)}</p>` : '<div style="margin-bottom:16px"></div>'}

    <div style="background:#EFF6FF;border-radius:16px;padding:18px;margin-bottom:16px">
      <p style="font-size:12px;color:#1D4ED8;font-weight:700;text-transform:uppercase">Maior lance até agora</p>
      <p style="font-size:34px;font-weight:900;color:#0A2463" id="valorMaiorLance">R$ ${moeda(maiorLance)}</p>
      <p style="font-size:12.5px;color:#64748b" id="qtdLances">${lancesAtuais.length} lance(s) dado(s)</p>
    </div>

    <div id="cronometro" style="background:#FFFBEB;border:1px solid #FDE68A;border-radius:14px;padding:12px;margin-bottom:20px;font-weight:800;color:#92400E;font-size:15px"></div>

    <form id="formLance" style="text-align:left">
      <label style="font-size:13px;font-weight:700;color:#334155">Seu nome</label>
      <input type="text" id="lanceNome" class="input" placeholder="Nome completo" required>

      <label style="font-size:13px;font-weight:700;color:#334155">Seu WhatsApp</label>
      <input type="tel" id="lanceTelefone" class="input" placeholder="(00) 00000-0000" maxlength="16" required>

      <label style="font-size:13px;font-weight:700;color:#334155" id="labelLanceMinimo">Seu lance (mínimo R$ ${moeda(proximoLanceMinimo)})</label>
      <input type="number" id="lanceValor" class="input" placeholder="R$ ${moeda(proximoLanceMinimo)}" min="${proximoLanceMinimo}" step="0.01" required>

      <button type="submit" id="btnDarLance" style="width:100%;background:#0A2463;color:#fff;font-weight:800;font-size:15.5px;padding:15px;border-radius:14px;border:none;cursor:pointer">
        🔨 Dar lance
      </button>
      <p id="erroLance" style="color:#DC2626;font-size:13px;margin-top:8px;display:none"></p>
    </form>

    <div style="margin-top:26px;text-align:left" id="blocoUltimosLances" ${lancesAtuais.length ? '' : 'hidden'}>
      <p style="font-size:13px;font-weight:800;color:#0A2463;margin-bottom:8px">Últimos lances</p>
      <div style="display:flex;flex-direction:column;gap:6px" id="listaUltimosLances">
        ${lancesAtuais.slice(0,6).map((l,idx) => `
          <div class="lance-item" style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:${idx===0?'#F0FDF4':'#F8FAFC'};border-radius:10px;border:1px solid ${idx===0?'#86EFAC':'#E2E8F0'}">
            <span style="font-size:13px;color:#334155">${idx===0?'🥇 ':''}${escapeHTML(mascararNome(l.nome))}</span>
            <strong style="font-size:13.5px;color:#0A2463">R$ ${moeda(l.valor)}</strong>
          </div>
        `).join('')}
      </div>
    </div>
  `;

  document.getElementById('lanceTelefone').addEventListener('input', e => {
    e.target.value = formatarTelefone(e.target.value);
  });

  document.getElementById('formLance').addEventListener('submit', enviarLance);

  atualizarCronometro();
  if(!intervaloCronometro){
    intervaloCronometro = setInterval(atualizarCronometro, 1000);
  }
}

function atualizarCronometro(){
  const el = document.getElementById('cronometro');
  if(!el || !leilaoAtual) return;

  const agora = new Date();
  const fim = new Date(leilaoAtual.horario_fim);
  const diffMs = fim - agora;

  if(diffMs <= 0){
    carregarLeilao();
    return;
  }

  const h = Math.floor(diffMs / 3600000);
  const m = Math.floor((diffMs % 3600000) / 60000);
  const s = Math.floor((diffMs % 60000) / 1000);

  el.textContent = `⏰ Termina em ${h > 0 ? h + 'h ' : ''}${String(m).padStart(2,'0')}min ${String(s).padStart(2,'0')}s`;
}

function mascararNome(nome){
  const partes = String(nome||'').trim().split(' ');
  if(partes.length === 1) return partes[0];
  return partes[0] + ' ' + partes[partes.length-1][0] + '.';
}

function escapeHTML(v){
  return String(v??'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

async function enviarLance(e){
  e.preventDefault();

  const cliente = inicializarSupabase();
  const btn = document.getElementById('btnDarLance');
  const erro = document.getElementById('erroLance');
  erro.style.display = 'none';

  const nome = document.getElementById('lanceNome').value.trim();
  const telefone = document.getElementById('lanceTelefone').value.replace(/\D/g,'');
  const valor = Number(document.getElementById('lanceValor').value);

  const maiorLance = lancesAtuais.length ? Number(lancesAtuais[0].valor) : Number(leilaoAtual.lance_minimo);
  const proximoLanceMinimo = lancesAtuais.length
    ? maiorLance + Number(leilaoAtual.incremento_minimo)
    : Number(leilaoAtual.lance_minimo);

  if(!nome){ erro.textContent = 'Informe seu nome.'; erro.style.display='block'; return; }
  if(telefone.length < 10){ erro.textContent = 'Informe um WhatsApp válido com DDD.'; erro.style.display='block'; return; }
  if(isNaN(valor) || valor < proximoLanceMinimo){
    erro.textContent = `Seu lance precisa ser de pelo menos R$ ${moeda(proximoLanceMinimo)}.`;
    erro.style.display='block';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Enviando...';

  const { error } = await cliente
    .from('leilao_lances')
    .insert({
      leilao_id: leilaoAtual.id,
      nome,
      telefone,
      valor
    });

  if(error){
    erro.textContent = 'Erro ao enviar lance: ' + error.message;
    erro.style.display = 'block';
    btn.disabled = false;
    btn.textContent = '🔨 Dar lance';
    return;
  }

  document.getElementById('lanceValor').value = '';
  btn.disabled = false;
  btn.textContent = '✅ Lance enviado! Você está na frente (por enquanto 😉)';
  setTimeout(() => { btn.textContent = '🔨 Dar lance'; }, 2500);

  await carregarLeilao();
}

carregarLeilao();
</script>

</body>
</html>
