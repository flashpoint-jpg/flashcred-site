<script>

/* ==========================================================
   SUPABASE
========================================================== */

const SUPABASE_URL =
    'https://rgcclordmqjmwuzrrfbd.supabase.co';

const SUPABASE_KEY =
    'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';

const supabase =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
            realtime: true
        }
    );


/* ==========================================================
   VARIÁVEIS
========================================================== */

let propostaAtual = null;

let canalRealtime = null;
let intervaloAtualizacaoCliente = null;

let webcamStream = null;

let modoAssinatura = 'texto';


/* ==========================================================
   INICIALIZAÇÃO
========================================================== */

document.addEventListener(
    'DOMContentLoaded',
    iniciar
);


async function iniciar() {

    const campo =
        document.getElementById(
            'cpfConsulta'
        );

    /*
     * Enter também executa a consulta.
     */
    campo.addEventListener(
        'keydown',
        function(e) {

            if(e.key === 'Enter') {

                e.preventDefault();

                executarConsulta();
            }

        }
    );


    /*
     * Formatação automática do CPF.
     */
    campo.addEventListener(
        'input',
        function() {

            let valor =
                campo.value
                .replace(/\D/g,'')
                .slice(0,11);

            if(valor.length > 9) {

                valor =
                    valor.replace(
                        /(\d{3})(\d{3})(\d{3})(\d{0,2})/,
                        '$1.$2.$3-$4'
                    );

            } else if(valor.length > 6) {

                valor =
                    valor.replace(
                        /(\d{3})(\d{3})(\d{0,3})/,
                        '$1.$2.$3'
                    );

            } else if(valor.length > 3) {

                valor =
                    valor.replace(
                        /(\d{3})(\d{0,3})/,
                        '$1.$2'
                    );
            }

            campo.value = valor;
        }
    );


    /*
     * ======================================================
     * CORREÇÃO PRINCIPAL:
     *
     * Se o cliente recebeu:
     *
     * proposta.html?id=UUID
     *
     * a proposta é carregada automaticamente.
     * ======================================================
     */

    const parametros =
        new URLSearchParams(
            window.location.search
        );

    const id =
        parametros.get('id');


    if(id) {

        const botao =
            document.getElementById(
                'btnConsultar'
            );

        botao.disabled = true;

        botao.innerHTML =
            '<i class="fas fa-spinner fa-spin"></i> Carregando proposta...';


        await carregarPorId(id);


        botao.disabled = false;

        botao.innerHTML =
            '<i class="fas fa-search"></i> Consultar proposta';


        return;
    }


    /*
     * Vindo do botão "Pagar Parcelas" do index.html:
     * consultar.html?cpf=NUMEROS
     * busca automaticamente.
     */

    const cpfUrl =
        parametros.get('cpf');

    if(cpfUrl) {

        campo.value =
            formatarCPF(cpfUrl);

        await executarConsulta(cpfUrl);

        return;
    }


    /*
     * Não abre automaticamente a proposta antiga.
     * Apenas preenche o CPF salvo.
     */
    const cpfSalvo =
        localStorage.getItem(
            'flashcred_cpf'
        );


    if(cpfSalvo) {

        campo.value =
            formatarCPF(cpfSalvo);
    }
}


/* ==========================================================
   FORMATAR CPF
========================================================== */

function somenteNumeros(valor) {

    return String(
        valor || ''
    ).replace(
        /\D/g,
        ''
    );
}


function formatarCPF(cpf) {

    cpf =
        somenteNumeros(cpf)
        .slice(0,11);


    if(cpf.length <= 3)
        return cpf;


    if(cpf.length <= 6) {

        return cpf.replace(
            /(\d{3})(\d+)/,
            '$1.$2'
        );
    }


    if(cpf.length <= 9) {

        return cpf.replace(
            /(\d{3})(\d{3})(\d+)/,
            '$1.$2.$3'
        );
    }


    return cpf.replace(
        /(\d{3})(\d{3})(\d{3})(\d{2})/,
        '$1.$2.$3-$4'
    );
}


/* ==========================================================
   CONSULTA CPF
========================================================== */

async function executarConsulta(
    cpfInformado = null
) {

    let cpf =
        cpfInformado ||
        document
            .getElementById('cpfConsulta')
            .value;


    cpf =
        somenteNumeros(cpf);


    if(cpf.length !== 11) {

        alert(
            'Digite os 11 números do CPF.'
        );

        return;
    }


    const botao =
        document.getElementById(
            'btnConsultar'
        );


    botao.disabled = true;

    botao.innerHTML =
        '<i class="fas fa-spinner fa-spin"></i> Consultando...';


    try {

        /*
         * Primeira tentativa:
         * CPF somente números.
         */
        let resultado =
            await supabase
                .from('propostas')
                .select('*')
                .eq('cpf', cpf)
                .limit(1);


        /*
         * Se não encontrou,
         * tenta CPF formatado.
         */
        if(
            !resultado.error &&
            (!resultado.data ||
             resultado.data.length === 0)
        ) {

            const cpfFormatado =
                formatarCPF(cpf);


            resultado =
                await supabase
                    .from('propostas')
                    .select('*')
                    .eq(
                        'cpf',
                        cpfFormatado
                    )
                    .limit(1);
        }


        if(resultado.error) {

            throw new Error(
                resultado.error.message
            );
        }


        if(
            !resultado.data ||
            resultado.data.length === 0
        ) {

            throw new Error(
                'Nenhuma proposta encontrada para este CPF.'
            );
        }


        /*
         * Se existir mais de uma proposta
         * para o CPF, atualmente pegamos
         * a primeira.
         */
        propostaAtual =
            resultado.data[0];


        salvarSessao();

        abrirProposta();

        configurarRealtime();


    } catch(error) {

        console.error(
            'Erro consulta CPF:',
            error
        );


        alert(
            error.message ||
            'Não foi possível consultar a proposta.'
        );


    } finally {

        botao.disabled = false;

        botao.innerHTML =
            '<i class="fas fa-search"></i> Consultar proposta';
    }
}

                .from('propostas')

}

async function calcularScoreClienteRemoto(cpf){

    try{
        const {data, error} = await supabase
            .from('propostas')
            .select('entrada_paga,parcelas_pagas,quantidade_parcelas,datas_parcelas,valor_desejado,valor_entrada,juros_mensal')
            .eq('cpf', cpf);

        if(error || !data || !data.length){
            return null;
        }

        const hoje = new Date();
        let somaPontualidade = 0;
        let bonusQuitada = 0;
        let usado = 0;

        data.forEach(p => {
            const datas = Array.isArray(p.datas_parcelas) ? p.datas_parcelas : [];
            const dueSoFar = datas.filter(d => new Date(d+'T00:00:00') <= hoje).length;
            const pagas = Number(p.parcelas_pagas) || 0;
            const atraso = Math.max(0, dueSoFar - pagas);

            const pontualidade = dueSoFar > 0 ? Math.max(0, 100 - (atraso * 20)) : 100;
            somaPontualidade += pontualidade;

            const quantidade = Number(p.quantidade_parcelas) || 0;
            const quitada = p.entrada_paga && quantidade > 0 && pagas >= quantidade;

            if(quitada && atraso === 0){
                bonusQuitada += 5;
            }

            const restantes = Math.max(0, quantidade - pagas);
            const principal = Math.max(0, (Number(p.valor_desejado)||0) - (Number(p.valor_entrada)||0));
            const valorParcela = calcularParcela(principal, p.juros_mensal, quantidade);
            usado += restantes * valorParcela;
        });

        const score = Math.min(100, Math.round((somaPontualidade / data.length) + bonusQuitada));

        let label = 'Regular', cor = '#F59E0B';
        if(score >= 85){ label = 'Excelente'; cor = '#10B981'; }
        else if(score >= 65){ label = 'Bom'; cor = '#3B82F6'; }
        else if(score < 40){ label = 'Atenção'; cor = '#EF4444'; }

        let limite = 0;
        try{
            const {data: dl} = await supabase.from('limites_cliente').select('limite').eq('cpf', cpf).maybeSingle();
            limite = dl ? Number(dl.limite)||0 : 0;
        }catch(e){ console.warn('Sem limite cadastrado para este CPF.'); }

        return {score, label, cor, limite, usado, disponivel: limite - usado};

    }catch(e){
        console.error('Erro ao calcular score:', e);
        return null;
    }
}

function booleano(valor) {

    if(
        valor === true ||
        valor === 1
    ) {

        return true;
    }


    if(
        typeof valor === 'string'
    ) {

        const v =
            valor
            .trim()
            .toLowerCase();


        return (
            v === 'true' ||
            v === '1' ||
            v === 'sim' ||
            v === 'pago'
        );
    }


    return false;
}

function configurarRealtime() {

    if(!propostaAtual)
        return;


    if(intervaloAtualizacaoCliente){ clearInterval(intervaloAtualizacaoCliente); intervaloAtualizacaoCliente=null; }

    if(canalRealtime) {

        supabase.removeChannel(
            canalRealtime
        );

        canalRealtime = null;
    }


    canalRealtime =
        supabase
            .channel(
                'flashcred_' +
                String(
                    propostaAtual.id
                ) +
                '_' +
                Date.now()
            )
            .on(
                'postgres_changes',
                {
                    event: 'UPDATE',
                    schema: 'public',
                    table: 'propostas',
                    filter:
                        `id=eq.${propostaAtual.id}`
                },
                function(payload) {

                    console.log(
                        'Atualização recebida:',
                        payload.new
                    );


                    if(payload.new) {

                        const jaEstavaPago =
                            booleano(propostaAtual.entrada_paga);

                        propostaAtual = {
                            ...propostaAtual,
                            ...payload.new
                        };


                        salvarSessao();


                        mostrarProposta(
                            propostaAtual
                        );


                        if(
                            booleano(
                                propostaAtual.entrada_paga
                            )
                        ) {

                            pararCamera();

                            if(!jaEstavaPago && propostaAtual.cpf){
                                mostrarAnimacaoScore(propostaAtual.cpf);
                            }
                        }
                    }
                }
            )
            .subscribe(
                function(status) {
                    console.log('Realtime:', status);
                }
            );

    // ✅ Polling de 5s removido — o Realtime acima já cobre a atualização automática
    // sem re-renderizar a tela toda hora (o que causava o piscar).
    if(intervaloAtualizacaoCliente) clearInterval(intervaloAtualizacaoCliente);
}


function obterQuantidadeParcelasOficial(p){
    const n = Number(p?.quantidade_parcelas || p?.qtd_parcelas || 0);
    // quantidade_parcelas é definida no painel pelo admin, que já controla
    // livremente esse valor (inclusive acima de 6x pra "na entrega", quando
    // há acordo com o cliente). O valor salvo é sempre a fonte da verdade
    // aqui — o limite padrão de 6x pra "na entrega" fica só no simulador
    // público (index.html) e no painel do funcionário, antes de existir
    // uma proposta com valor definido pelo admin.
    return Math.min(48, Math.max(0, Math.floor(n)));
}

function determinarEtapa(p) {

    if(!p)
        return 1;


    const status =
        String(
            p.status || ''
        )
        .trim()
        .toLowerCase();


    const aprovado =
        status === 'aprovada' ||
        status === 'aprovado';


    const parcelas =
        Number(
            p.qtd_parcelas_escolhida || 0
        );


    const assinado =
        booleano(
            p.contrato_assinado
        );


    const entradaPaga =
        booleano(
            p.entrada_paga
        );


    if(entradaPaga) {

        return 5;
    }


    if(!aprovado) {

        return 1;
    }


    if(!parcelas) {

        return 2;
    }


    if(!assinado) {

        return 3;
    }


    return 4;
}

/**
 * Calcula os dados pra mostrar a barra de "dias até vencer" a próxima
 * parcela em aberto. Considera um ciclo de 30 dias entre parcelas pra
 * saber o quanto da barra já "andou".
 */
function calcularInfoProximoVencimento(p){
    try{
        const quantidade = Number(p.qtd_parcelas_escolhida || (booleano(p.entrada_paga) ? p.quantidade_parcelas : 0)) || 0;
        const pagas = Number(p.parcelas_pagas) || 0;
        const datas = Array.isArray(p.datas_parcelas) ? p.datas_parcelas : [];

        if(pagas >= quantidade || !datas[pagas]) return null;

        const hoje = new Date(); hoje.setHours(0,0,0,0);
        const vencimento = new Date(datas[pagas]+'T00:00:00');
        const diasRestantes = Math.round((vencimento - hoje) / 86400000);

        const principal = Math.max(0, (Number(p.valor_desejado)||0) - (Number(p.valor_entrada)||0));
        const valorParcela = calcularParcela(principal, p.juros_mensal, quantidade);

        let valorAPagar = valorParcela;
        if(diasRestantes < 0){
            const diasAtraso = Math.abs(diasRestantes);
            const valorMulta = valorParcela * 0.02;
            const valorMora = (valorParcela * 0.01 / 30) * diasAtraso;
            valorAPagar = valorParcela + valorMulta + valorMora;
        }

        const cicloDias = 30;
        const diasDecorridos = cicloDias - diasRestantes;
        const percentual = Math.max(4, Math.min(100, Math.round((diasDecorridos / cicloDias) * 100)));

        let texto, cor;
        if(diasRestantes < 0){
            texto = `Vencida há ${Math.abs(diasRestantes)} dia(s)`;
            cor = '#F87171';
        } else if(diasRestantes === 0){
            texto = 'Vence hoje';
            cor = '#FBBF24';
        } else if(diasRestantes <= 3){
            texto = `Faltam ${diasRestantes} dia(s)`;
            cor = '#FBBF24';
        } else {
            texto = `Faltam ${diasRestantes} dia(s)`;
            cor = '#34D399';
        }

        return {
            numeroParcela: pagas + 1,
            dataFormatada: vencimento.toLocaleDateString('pt-BR'),
            diasRestantes,
            percentual,
            texto,
            cor,
            valorAPagar: Number(valorAPagar.toFixed(2))
        };
    }catch(e){ return null; }
}

function moeda(valor) {

    return Number(
        valor || 0
    ).toLocaleString(
        'pt-BR',
        {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        }
    );
}


function escapar(valor) {

    return String(
        valor ?? ''
    )
    .replace(
        /&/g,
        '&amp;'
    )
    .replace(
        /</g,
        '&lt;'
    )
    .replace(
        />/g,
        '&gt;'
    )
    .replace(
        /"/g,
        '&quot;'
    )
    .replace(
        /'/g,
        '&#039;'
    );
}

function descreverProduto(prod) {

    const partes = [
        prod.nome ? escapar(prod.nome) : 'Móvel'
    ];

    if (prod.quantidade) partes.push(`Quantidade: ${Number(prod.quantidade)}`);
    if (prod.cor) partes.push(`Cor: ${escapar(prod.cor)}`);
    if (prod.espelho === 'com_espelho') partes.push('Com espelho');
    if (prod.espelho === 'sem_espelho') partes.push('Sem espelho');
    if (prod.valor) partes.push(`Valor: R$ ${moeda(Number(prod.valor))}`);

    return partes.join(' — ');
}

function calcularParcela(
    principal,
    juros,
    quantidade
) {

    principal =
        Number(
            principal || 0
        );


    juros =
        Number(
            juros || 0
        ) / 100;


    quantidade =
        Number(
            quantidade || 0
        );


    if(
        principal <= 0 ||
        quantidade <= 0
    ) {

        return 0;
    }


    if(juros <= 0) {

        return principal /
            quantidade;
    }


    return (
        principal *
        (
            juros *
            Math.pow(
                1 + juros,
                quantidade
            )
        )
    )
    /
    (
        Math.pow(
            1 + juros,
            quantidade
        ) - 1
    );
}

/* ==========================================================
   DIAS ÚTEIS
========================================================== */

function calcularDiasUteis(
    inicio,
    totalDias
) {

    totalDias =
        Number(
            totalDias || 0
        );


    if(
        !inicio ||
        totalDias <= 0
    ) {

        return {

            decorridos: 0,

            restantes:
                totalDias,

            porcentagem: 0
        };
    }


    const inicioData =
        new Date(inicio);


    const hoje =
        new Date();


    inicioData.setHours(
        0,0,0,0
    );


    hoje.setHours(
        0,0,0,0
    );


    if(
        hoje <= inicioData
    ) {

        return {

            decorridos: 0,

            restantes:
                totalDias,

            porcentagem: 0
        };
    }


    let decorridos = 0;


    let atual =
        new Date(
            inicioData
        );


    while(
        atual < hoje
    ) {

        const dia =
            atual.getDay();


        if(
            dia !== 0 &&
            dia !== 6
        ) {

            decorridos++;
        }


        atual.setDate(
            atual.getDate() + 1
        );
    }


    decorridos =
        Math.min(
            decorridos,
            totalDias
        );


    const restantes =
        Math.max(
            totalDias -
            decorridos,
            0
        );


    const porcentagem =
        Math.min(
            100,
            Math.round(
                (
                    decorridos /
                    totalDias
                ) * 100
            )
        );


    return {

        decorridos,

        restantes,

        porcentagem
    };
}

async function confirmarParcelas() {

    const select =
        document.getElementById(
            'qtdEscolhida'
        );


    if(!select)
        return;


    const quantidade = Number(select.value || 0);


    if(
        !quantidade ||
        quantidade < 1 ||
        quantidade > obterQuantidadeParcelasOficial(propostaAtual)
    ) {

        alert(
            'A quantidade de parcelas ainda não foi configurada no painel.'
        );

        return;
    }


    const botao =
        document.getElementById(
            'btnConfirmarParcelas'
        );


    botao.disabled = true;


    botao.innerHTML =
        '<i class="fas fa-spinner fa-spin"></i> Salvando...';


    try {

        const { data, error } =
            await supabase
                .from('propostas')
                .update({

                    qtd_parcelas_escolhida: quantidade,
                    datas_parcelas: (() => {
                        const atuais = Array.isArray(propostaAtual.datas_parcelas) ? propostaAtual.datas_parcelas : [];
                        if(atuais.length >= quantidade) return atuais.slice(0, quantidade);
                        const base = new Date();
                        const out = [];
                        for(let i=1;i<=quantidade;i++){ const d=new Date(base); d.setMonth(d.getMonth()+i); out.push(d.toISOString().slice(0,10)); }
                        return out;
                    })()

                })
                .eq(
                    'id',
                    propostaAtual.id
                )
                .select()
                .single();


        if(error) {

            throw new Error(
                error.message
            );
        }


        propostaAtual = {

            ...propostaAtual,

            ...data,

            qtd_parcelas_escolhida:
                quantidade
        };


        salvarSessao();


        mostrarProposta(
            propostaAtual
        );


    } catch(error) {

        console.error(
            error
        );


        alert(
            'Não foi possível salvar a quantidade de parcelas.\n\n' +
            error.message
        );


        botao.disabled = false;


        botao.innerHTML =
            '<i class="fas fa-arrow-right"></i> Continuar para o contrato';
    }
}

        if(ok) btn.classList.add('hidden');

async function iniciarCamera(mostrarErro=true) {
    try {
        pararCamera();

        if(!window.isSecureContext) {
            throw new Error('A câmera só funciona em conexão segura (HTTPS).');
        }

        if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            throw new Error('Este navegador não oferece acesso à câmera.');
        }

        const video = document.getElementById('videoAssinatura');
        if(!video) throw new Error('Área da câmera não encontrada.');

        atualizarStatusSelfie('Solicitando permissão da câmera...');

        // Primeiro tenta a câmera frontal. Se algum Android rejeitar as
        // preferências de resolução/facingMode, tenta novamente com configuração simples.
        try {
            webcamStream = await navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode: 'user',
                    width: { ideal: 720 },
                    height: { ideal: 960 }
                },
                audio: false
            });
        } catch(primeiroErro) {
            webcamStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        }

        video.srcObject = webcamStream;
        video.setAttribute('playsinline', '');
        video.setAttribute('webkit-playsinline', '');
        video.muted = true;
        video.autoplay = true;

        await new Promise((resolve, reject) => {
            let terminou = false;
            const pronto = () => {
                if(terminou) return;
                if(video.readyState >= 2 || (video.videoWidth > 0 && video.videoHeight > 0)) {
                    terminou = true;
                    clearTimeout(timer);
                    resolve();
                }
            };
            const timer = setTimeout(() => {
                if(terminou) return;
                terminou = true;
                if(video.videoWidth > 0 && video.videoHeight > 0) resolve();
                else reject(new Error('A câmera abriu, mas o vídeo não ficou pronto.'));
            }, 10000);
            video.addEventListener('loadedmetadata', pronto, { once:false });
            video.addEventListener('canplay', pronto, { once:false });
            video.addEventListener('playing', pronto, { once:false });
            try { const playPromise = video.play(); if(playPromise) playPromise.catch(()=>{}); } catch(e) {}
            pronto();
        });

        try { await video.play(); } catch(e) {}

        const placeholder = document.getElementById('selfiePlaceholder');
        const guia = document.getElementById('selfieGuia');
        const img = document.getElementById('imagemAssinatura');
        const capturar = document.getElementById('btnCapturarSelfie');
        const refazer = document.getElementById('btnRefazerSelfie');
        if(placeholder) placeholder.classList.add('hidden');
        if(img) img.classList.add('hidden');
        video.classList.remove('hidden');
        if(guia) guia.classList.remove('hidden');
        if(capturar) capturar.classList.remove('hidden');
        if(refazer) refazer.classList.add('hidden');
        atualizarStatusSelfie('Câmera pronta. Centralize o rosto dentro da marcação.', 'ok');

        return true;

    } catch(error) {
        console.error('Erro ao iniciar câmera:', error);
        pararCamera();

        let mensagem = 'Não foi possível abrir a câmera.';
        const nome = error && error.name ? error.name : '';
        if(nome === 'NotAllowedError' || nome === 'PermissionDeniedError') {
            mensagem = 'Permissão da câmera bloqueada. Libere a câmera nas permissões deste site e tente novamente.';
        } else if(nome === 'NotFoundError' || nome === 'DevicesNotFoundError') {
            mensagem = 'Nenhuma câmera foi encontrada neste aparelho.';
        } else if(nome === 'NotReadableError' || nome === 'TrackStartError') {
            mensagem = 'A câmera está sendo usada por outro aplicativo. Feche o outro app e tente novamente.';
        } else if(error && error.message) {
            mensagem = error.message;
        }

        atualizarStatusSelfie(mensagem + ' Você também pode usar o botão “Usar foto/selfie”.', 'erro');
        const abrir = document.getElementById('btnAbrirCamera');
        const capturar = document.getElementById('btnCapturarSelfie');
        const placeholder = document.getElementById('selfiePlaceholder');
        const guia = document.getElementById('selfieGuia');
        if(abrir) abrir.classList.remove('hidden');
        if(capturar) capturar.classList.add('hidden');
        if(placeholder) placeholder.classList.remove('hidden');
        if(guia) guia.classList.add('hidden');
        if(mostrarErro) {
            // Evita alert genérico que escondia a tela; o erro fica visível na própria página.
        }
        return false;
    }
}

function pararCamera() {
    if(webcamStream) {
        webcamStream.getTracks().forEach(track => track.stop());
        webcamStream = null;
    }
    const video = document.getElementById('videoAssinatura');
    if(video) {
        try { video.pause(); } catch(e) {}
        video.srcObject = null;
    }
}

async function tirarFoto() {
    let video = document.getElementById('videoAssinatura');

    if(!video || !video.videoWidth || !video.videoHeight) {
        atualizarStatusSelfie('Preparando a câmera...', '');
        const pronta = await iniciarCamera(true);
        video = document.getElementById('videoAssinatura');
        if(!pronta || !video || !video.videoWidth || !video.videoHeight) return;
    }

    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    const contexto = canvas.getContext('2d');
    // Espelha a imagem salva para ficar igual ao preview da câmera frontal.
    contexto.translate(canvas.width, 0);
    contexto.scale(-1, 1);
    contexto.drawImage(video, 0, 0, canvas.width, canvas.height);

    const imagem = document.getElementById('imagemAssinatura');
    if(!imagem) {
        atualizarStatusSelfie('Não foi possível preparar a selfie.', 'erro');
        return;
    }

    imagem.src = canvas.toDataURL('image/jpeg', .88);
    imagem.classList.remove('hidden');
    video.classList.add('hidden');

    const placeholder = document.getElementById('selfiePlaceholder');
    const guia = document.getElementById('selfieGuia');
    const capturar = document.getElementById('btnCapturarSelfie');
    const abrir = document.getElementById('btnAbrirCamera');
    const refazer = document.getElementById('btnRefazerSelfie');
    const fotoCapturada = document.getElementById('fotoCapturada');
    if(placeholder) placeholder.classList.add('hidden');
    if(guia) guia.classList.add('hidden');
    if(capturar) capturar.classList.add('hidden');
    if(abrir) abrir.classList.add('hidden');
    if(refazer) refazer.classList.remove('hidden');
    if(fotoCapturada) fotoCapturada.classList.remove('hidden');

    pararCamera();
    atualizarStatusSelfie('Selfie capturada com sucesso. Se ficou boa, pode assinar o contrato.', 'ok');
}

async function usarArquivoSelfie(input) {
    try {
        const arquivo = input && input.files ? input.files[0] : null;
        if(!arquivo) return;
        if(!arquivo.type || !arquivo.type.startsWith('image/')) {
            atualizarStatusSelfie('Escolha um arquivo de imagem para usar como selfie.', 'erro');
            input.value = '';
            return;
        }
        // Evita arquivos exageradamente grandes em notebooks/celulares antigos.
        if(arquivo.size > 12 * 1024 * 1024) {
            atualizarStatusSelfie('Essa imagem é muito grande. Escolha uma foto de até 12 MB.', 'erro');
            input.value = '';
            return;
        }

        atualizarStatusSelfie('Preparando a selfie selecionada...');
        pararCamera();

        const dataUrl = await new Promise((resolve, reject) => {
            const leitor = new FileReader();
            leitor.onload = () => resolve(leitor.result);
            leitor.onerror = () => reject(new Error('Não foi possível ler a imagem selecionada.'));
            leitor.readAsDataURL(arquivo);
        });

        const imagem = document.getElementById('imagemAssinatura');
        if(!imagem) throw new Error('Área da selfie não encontrada.');

        await new Promise((resolve, reject) => {
            imagem.onload = resolve;
            imagem.onerror = () => reject(new Error('A imagem escolhida não pôde ser aberta.'));
            imagem.src = dataUrl;
        });

        imagem.classList.remove('hidden');
        const video = document.getElementById('videoAssinatura');
        const placeholder = document.getElementById('selfiePlaceholder');
        const guia = document.getElementById('selfieGuia');
        const capturar = document.getElementById('btnCapturarSelfie');
        const abrir = document.getElementById('btnAbrirCamera');
        const refazer = document.getElementById('btnRefazerSelfie');
        const fotoCapturada = document.getElementById('fotoCapturada');
        if(video) video.classList.add('hidden');
        if(placeholder) placeholder.classList.add('hidden');
        if(guia) guia.classList.add('hidden');
        if(capturar) capturar.classList.add('hidden');
        if(abrir) abrir.classList.add('hidden');
        if(refazer) refazer.classList.remove('hidden');
        if(fotoCapturada) fotoCapturada.classList.remove('hidden');

        atualizarStatusSelfie('Selfie carregada com sucesso. Confira a foto e, se estiver boa, pode assinar o contrato.', 'ok');
    } catch(error) {
        console.error('Erro ao carregar selfie:', error);
        atualizarStatusSelfie(error && error.message ? error.message : 'Não foi possível usar essa foto.', 'erro');
        if(input) input.value = '';
    }
}

function refazerFoto() {
    const imagem = document.getElementById('imagemAssinatura');
    const fotoCapturada = document.getElementById('fotoCapturada');
    const refazer = document.getElementById('btnRefazerSelfie');
    const abrir = document.getElementById('btnAbrirCamera');
    if(imagem) { imagem.src = ''; imagem.classList.add('hidden'); }
    if(fotoCapturada) fotoCapturada.classList.add('hidden');
    if(refazer) refazer.classList.add('hidden');
    if(abrir) abrir.classList.remove('hidden');
    const arquivoSelfie = document.getElementById('arquivoSelfie');
    if(arquivoSelfie) arquivoSelfie.value = '';
    atualizarStatusSelfie('Toque em “Abrir câmera” para tirar outra selfie, ou use uma foto do aparelho.');
    abrirCameraSelfie();
}

async function assinarContrato() {

    try {

        const aceite =
            document.getElementById(
                'aceitoContrato'
            );


        if(
            !aceite ||
            !aceite.checked
        ) {

            alert(
                'Marque a opção de concordância com o contrato.'
            );

            return;
        }


        const campoNome =
            document.getElementById(
                'assTxt'
            );


        const assinatura =
            campoNome
            ? campoNome.value.trim()
            : '';


        if(!assinatura) {

            alert(
                'Digite seu nome completo para assinar.'
            );

            return;
        }


        const imagem =
            document.getElementById(
                'imagemAssinatura'
            );


        if(
            !imagem ||
            !imagem.src ||
            imagem.src.length < 100
        ) {

            alert(
                'Tire a selfie antes de assinar — ela é obrigatória para confirmar sua identidade.'
            );

            return;
        }


        const selfie =
            imagem.src;


        if(
            !propostaAtual ||
            !propostaAtual.id
        ) {

            alert(
                'Proposta não encontrada.'
            );

            return;
        }


        const botao =
            document.getElementById(
                'btnAssinar'
            );


        if(!botao){ alert('Não foi possível localizar o botão de assinatura. Atualize a página.'); return; }

        botao.disabled = true;


        botao.innerHTML =
            '<i class="fas fa-spinner fa-spin"></i> Salvando assinatura...';


        const { data, error } =
            await supabase
                .from('propostas')
                .update({

                    contrato_assinado:
                        true,

                    assinatura:
                        assinatura,

                    selfie_url:
                        selfie,

                    data_assinatura:
                        new Date()
                            .toISOString()

                })
                .eq(
                    'id',
                    propostaAtual.id
                )
                .select()
                .single();


        if(error) {

            throw new Error(
                error.message ||
                'Erro ao salvar assinatura.'
            );
        }


        if(!data) {

            throw new Error(
                'O banco não confirmou o salvamento da assinatura.'
            );
        }


        propostaAtual = {

            ...propostaAtual,

            ...data,

            contrato_assinado:
                true,

            assinatura:
                assinatura,

            selfie_url:
                selfie
        };


        salvarSessao();


        pararCamera();


        mostrarProposta(
            propostaAtual
        );


    } catch(error) {

        console.error(
            'Erro assinatura:',
            error
        );


        alert(
            'Não foi possível assinar o contrato.\n\n' +
            'Motivo:\n' +
            (
                error.message ||
                error
            )
        );


        const botao =
            document.getElementById(
                'btnAssinar'
            );


        if(botao) {

            botao.disabled =
                false;


            botao.innerHTML =
                '<i class="fas fa-file-signature"></i> Assinar contrato';
        }
    }
}


/* ==========================================================
   PIX
========================================================== */

async function buscarPix(
    valor,
    descricao,
    dadosExtras
) {

    const resposta =
        await fetch(
            '/api/gerar-pix',
            {

                method: 'POST',

                headers: {

                    'Content-Type':
                        'application/json'

                },

                body:
                    JSON.stringify({

                        valor:
                            Number(valor)
                            .toFixed(2),

                        descricao:
                            descricao,

                        ...(dadosExtras || {})

                    })
            }
        );


    if(!resposta.ok) {

        let mensagem =
            'Erro ao gerar Pix.';


        try {

            const erro =
                await resposta.json();


            mensagem =
                erro.message ||
                erro.error ||
                mensagem;

        } catch(e) {}


        throw new Error(
            mensagem
        );
    }


    const dados =
        await resposta.json();


    const codigo =
        dados.qr_code ||
        dados.copia_cola ||
        dados.pixCopiaECola ||
        dados.codigo ||
        dados.qrCode ||
        dados.payload;


    if(!codigo) {

        throw new Error(
            'A API não retornou o código Pix.'
        );
    }


    return codigo;
}

    }

    el.innerHTML = html;
}


async function selecionarFormaPagamento(novaForma) {

    if(!propostaAtual)
        return;

    const formaAtual =
        propostaAtual.forma_pagamento_entrada ||
        'pix_antecipado';

    if(novaForma === formaAtual)
        return;

    await trocarFormaEntrada(novaForma);
}


/* ==========================================================
   PIX ENTRADA
========================================================== */

async function trocarFormaEntrada(novaForma) {

    if(!propostaAtual)
        return;

    if(propostaAtual.em_rota_entrega) {
        alert('Seu pedido já está a caminho — não é mais possível trocar a forma de pagamento da entrada.');
        return;
    }

    const nomesForma = {
        pix_antecipado: 'pagar agora no Pix (40% de entrada)',
        na_entrega: 'pagar a entrada só na entrega (55% do valor)',
        cartao_entrega: 'pagar no cartão de crédito na entrega (sem entrada)',
        pix_total_entrega: 'pagar o valor total no Pix na entrega (sem entrada, sem parcelamento)'
    };

    const nomeNova = nomesForma[novaForma] || novaForma;

    const confirmar =
        confirm(
            `Tem certeza que quer trocar e ${nomeNova}? O valor da entrada e das parcelas vai ser recalculado.`
        );

    if(!confirmar)
        return;

    const valorTotal = Number(propostaAtual.valor_desejado || 0);

    const percentuaisPorForma = {
        pix_antecipado: 0.40,
        na_entrega: 0.55,
        cartao_entrega: 0,
        pix_total_entrega: 0
    };

    const novoPercentual = percentuaisPorForma[novaForma] ?? 0.40;

    const novaEntrada =
        Math.round(valorTotal * novoPercentual * 100) / 100;

    try {

        const { error } =
            await supabase
                .from('propostas')
                .update({
                    forma_pagamento_entrada: novaForma,
                    valor_entrada: novaEntrada
                })
                .eq('id', propostaAtual.id);

        if(error)
            throw new Error(error.message);

        await carregarPorId(propostaAtual.id);

    } catch(e) {

        alert(
            'Não foi possível trocar a forma de pagamento: ' +
            e.message
        );
    }
}

function calcularDataEntregaUtil(
    inicio,
    totalDias
) {

    if(
        !inicio ||
        Number(totalDias || 0) <= 0
    ) {

        return null;
    }


    const d =
        new Date(inicio);


    d.setHours(
        0,0,0,0
    );


    let contados = 0;


    while(
        contados <
        Number(totalDias)
    ) {

        d.setDate(
            d.getDate() + 1
        );


        const dia =
            d.getDay();


        if(
            dia !== 0 &&
            dia !== 6
        ) {

            contados++;
        }
    }


    return d;
}


/* ==========================================================
   PARCELAS
========================================================== */

function montarParcelas(p) {

    // Normalmente o cliente escolhe a quantidade antes de pagar a entrada.
    // Mas se a entrada já foi confirmada e por algum motivo ele nunca
    // chegou a escolher (ex: admin confirmou manualmente), usa a
    // quantidade que o admin configurou em vez de travar a tela.
    const quantidade =
        Number(
            p.qtd_parcelas_escolhida ||
            (booleano(p.entrada_paga) ? p.quantidade_parcelas : 0) ||
            0
        );


    if(
        quantidade <= 0
    ) {

        return `

            <div class="card">

                <div class="info info-yellow">

                    <strong>

                        Parcelas ainda não configuradas.

                    </strong>

                </div>

            </div>

        `;
    }


    const valor =
        Number(
            p.valor_desejado ||
            0
        );


    const entrada =
        Number(
            p.valor_entrada ||
            0
        );


    const juros =
        Number(
            p.juros_mensal ||
            0
        );


    const principal =
        Math.max(
            valor -
            entrada,
            0
        );


    const valorParcela =
        calcularParcela(
            principal,
            juros,
            quantidade
        );


    const totalParcelas =
        valorParcela *
        quantidade;


    const totalFinal =
        entrada +
        totalParcelas;


    const datasSalvas =
        Array.isArray(
            p.datas_parcelas
        )
        ? p.datas_parcelas
        : [];


    const parcelasPagas =
        Number(
            p.parcelas_pagas ||
            0
        );


    let datas = [];


    if(
        datasSalvas.length >=
        quantidade
    ) {

        datas =
            datasSalvas.slice(
                0,
                quantidade
            );

    } else {

        const base =
            p.data_pagamento_entrada ||
            p.entrada_pago_em ||
            new Date();


        for(
            let i = 1;
            i <= quantidade;
            i++
        ) {

            datas.push(

                adicionarMeses(
                    base,
                    i
                )
                .toISOString()
                .split('T')[0]

            );
        }
    }


    let html = `

        <div class="card">

            <div class="flex items-center justify-between mb-4">

                <div>

                    <h3 class="text-xl font-bold">

                        Suas parcelas

                    </h3>


                    <p class="text-sm text-slate-500">

                        ${quantidade} parcelas

                    </p>

                </div>


                <i class="fas fa-calendar-days text-2xl text-primary"></i>

            </div>


            <div class="resumo">

                <div class="resumo-item">

                    <span>
                        Valor da compra
                    </span>

                    <strong>
                        R$ ${moeda(valor)}
                    </strong>

                </div>


                <div class="resumo-item">

                    <span>
                        Entrada paga
                    </span>

                    <strong>
                        R$ ${moeda(entrada)}
                    </strong>

                </div>


                <div class="resumo-item">

                    <span>
                        Valor financiado
                    </span>

                    <strong>
                        R$ ${moeda(principal)}
                    </strong>

                </div>


                <div class="resumo-item">

                    <span>
                        Juros mensais
                    </span>

                    <strong>
                        ${numero(juros)}% a.m.
                    </strong>

                </div>


                <div class="resumo-item">

                    <span>
                        Parcelamento
                    </span>

                    <strong>

                        ${quantidade}x de
                        R$ ${moeda(valorParcela)}

                    </strong>

                </div>


                <div class="resumo-item">

                    <span>
                        Total das parcelas
                    </span>

                    <strong>

                        R$
                        ${moeda(totalParcelas)}

                    </strong>

                </div>


                <div class="resumo-item total-final">

                    <span>
                        Total final a pagar
                    </span>

                    <strong>

                        R$
                        ${moeda(totalFinal)}

                    </strong>

                </div>

            </div>


            <button
                type="button"
                class="btn btn-primary mb-3"
                onclick="imprimirContrato()"
            >

                <i class="fas fa-print"></i>

                Imprimir contrato

            </button>


            <button
                type="button"
                class="btn btn-whatsapp mb-4"
                onclick="abrirSuporteWhatsApp()"
            >

                <i class="fab fa-whatsapp"></i>

                Falar com suporte no WhatsApp

            </button>

    `;


    let htmlPagas = '';

    for(
        let i = 0;
        i < quantidade;
        i++
    ) {

        const numeroParcela =
            i + 1;


        const vencimento =
            datas[i];


        const dataVencimento =
            new Date(
                vencimento +
                'T00:00:00'
            );


        const hoje =
            new Date();


        hoje.setHours(
            0,0,0,0
        );


        const paga =
            numeroParcela <=
            parcelasPagas;


        const atrasada =
            !paga &&
            dataVencimento <
            hoje;


        /*
         * MULTA POR ATRASO:
         * 2% de multa fixa + 1% ao mês de mora
         * (proporcional aos dias em atraso),
         * dentro do limite do Código de Defesa do Consumidor.
         */

        let diasAtraso = 0;
        let valorMulta = 0;
        let valorMora = 0;
        let valorComMulta = valorParcela;

        if(atrasada) {

            diasAtraso =
                Math.floor(
                    (hoje - dataVencimento) /
                    86400000
                );

            valorMulta =
                valorParcela * 0.02;

            valorMora =
                (valorParcela * 0.01 / 30) *
                diasAtraso;

            valorComMulta =
                valorParcela +
                valorMulta +
                valorMora;
        }


        let statusHTML = '';


        if(paga) {

            statusHTML = `

                <span class="status status-pago">

                    <i class="fas fa-check"></i>

                    PAGO

                </span>

            `;

        } else if(atrasada) {

            statusHTML = `

                <span class="status status-atrasado">

                    <i class="fas fa-triangle-exclamation"></i>

                    ATRASADA

                </span>

            `;

        } else {

            statusHTML = `

                <span class="status status-pendente">

                    <i class="fas fa-clock"></i>

                    PENDENTE

                </span>

            `;
        }


        const blocoParcela = `

            <div class="parcela" id="parcela-${numeroParcela}">

                <div class="parcela-topo">

                    <div>

                        <div class="parcela-numero">

                            ${numeroParcela}ª parcela

                        </div>


                        <div class="text-xs text-slate-500 mt-1">

                            Vencimento:

                            ${dataBR(vencimento)}

                        </div>

                    </div>


                    <div class="text-right">

                        <div class="parcela-valor">

                            R$
                            ${moeda(atrasada ? valorComMulta : valorParcela)}

                        </div>

                        ${
                            atrasada
                            ? `
                                <div class="text-xs text-red-600 mt-1" style="font-weight:700">
                                    Inclui multa de 2% + mora
                                    (${diasAtraso} dia${diasAtraso === 1 ? '' : 's'} de atraso)
                                </div>
                            `
                            : ''
                        }


                        <div class="mt-1">

                            ${statusHTML}

                        </div>

                    </div>

                </div>


                <div class="parcela-detalhes">

                    <div class="parcela-info">

                        <small>
                            Parcela
                        </small>

                        <strong>

                            ${numeroParcela}
                            de
                            ${quantidade}

                        </strong>

                    </div>


                    <div class="parcela-info">

                        <small>
                            Vencimento
                        </small>

                        <strong>

                            ${dataBR(vencimento)}

                        </strong>

                    </div>

                </div>


                ${
                    !paga

                    ? `

                        <button
                            onclick="gerarPixParcela(
                                ${Number(
                                    (atrasada ? valorComMulta : valorParcela).toFixed(2)
                                )},
                                ${numeroParcela}
                            )"
                            class="btn btn-pix"
                        >

                            <i class="fas fa-qrcode"></i>

                            Gerar Pix para pagar

                        </button>


                        <div
                            id="pixParcela${numeroParcela}"
                            class="hidden"
                        ></div>

                    `

                    : `

                        <div class="info info-green mb-0">

                            <i class="fas fa-circle-check"></i>

                            Esta parcela já está registrada
                            como paga.

                        </div>

                    `
                }

            </div>

        `;

        if(paga){
            htmlPagas += blocoParcela;
        } else {
            html += blocoParcela;
        }
    }


    html += `

        </div>

    `;

    if(htmlPagas){
        html += `
            <div class="card" style="margin-top:16px">
                <details>
                    <summary style="cursor:pointer;font-weight:800;color:#0A2463;font-size:15px;list-style:none;display:flex;align-items:center;gap:8px">
                        <i class="fas fa-check-circle" style="color:#10B981"></i>
                        Parcelas já pagas
                    </summary>
                    <div style="margin-top:10px">
                        ${htmlPagas}
                    </div>
                </details>
            </div>
        `;
    }

    return html;
}

function pedirPermissaoNotificacaoCliente(){
    if(!('Notification' in window)) return Promise.resolve('unsupported');
    if(Notification.permission === 'default'){
        return Notification.requestPermission();
    }
    return Promise.resolve(Notification.permission);
}

function urlBase64ParaUint8Array(base64String){
    const padding = '='.repeat((4 - base64String.length % 4) % 4);
    const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
    const rawData = atob(base64);
    return Uint8Array.from([...rawData].map(char => char.charCodeAt(0)));
}

// Inscreve o dispositivo pra receber notificação push de verdade — chega
// mesmo com o app fechado (vencimento de parcela, entrada confirmada etc).
// Só inscreve uma vez por dispositivo (evita repetir a cada visita).
function mostrarConvitePushCliente(cpf){
    const el = document.getElementById('convitePushCliente');
    if(!el) return;
    el.dataset.cpf = cpf;
    el.style.display = 'flex';
}

async function ativarNotificacaoCliente(){
    const el = document.getElementById('convitePushCliente');
    const cpf = el?.dataset?.cpf;

    await pedirPermissaoNotificacaoCliente();

    setTimeout(async () => {
        await inscreverPushCliente(cpf, true);
        if(el && Notification.permission === 'granted') el.style.display = 'none';
    }, 300);
}

async function inscreverPushCliente(cpf, modoDiagnostico){
    try{
        if(!cpf){
            if(modoDiagnostico) alert('❌ CPF não identificado nesta tela.');
            return;
        }
        if(!('serviceWorker' in navigator) || !('PushManager' in window)){
            if(modoDiagnostico) alert('❌ Esse navegador não suporta notificações push.');
            return;
        }
        if(Notification.permission !== 'granted'){
            if(modoDiagnostico) alert('❌ Permissão de notificação não está concedida (status: ' + Notification.permission + '). Permita notificações para este site/app.');
            return;
        }
        if(!modoDiagnostico && localStorage.getItem('flashcred_push_inscrito_' + cpf)) return;

        const registration = await navigator.serviceWorker.ready;

        let subscription = await registration.pushManager.getSubscription();
        if(!subscription){
            const resp = await fetch('/api/push/chave-publica');
            const { chave } = await resp.json();
            if(!chave){
                if(modoDiagnostico) alert('❌ O servidor não retornou a chave pública (VAPID).');
                return;
            }

            subscription = await registration.pushManager.subscribe({
                userVisibleOnly: true,
                applicationServerKey: urlBase64ParaUint8Array(chave)
            });
        }

        const respRegistrar = await fetch('/api/push/registrar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ papel: 'cliente', referencia: cpf, subscription })
        });

        const resultado = await respRegistrar.json().catch(() => null);

        if(!respRegistrar.ok || (resultado && resultado.sucesso === false)){
            if(modoDiagnostico) alert('❌ O servidor recusou o cadastro: ' + (resultado?.mensagem || respRegistrar.status));
            return;
        }

        localStorage.setItem('flashcred_push_inscrito_' + cpf, '1');
        if(modoDiagnostico) alert('✅ Inscrito com sucesso! Notificações push devem chegar a partir de agora.');

    }catch(e){
        console.warn('Não foi possível inscrever notificações push:', e);
        if(modoDiagnostico) alert('❌ Erro ao inscrever: ' + (e.message || e));
    }
}
