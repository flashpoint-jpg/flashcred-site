<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Controle Flash Trocas</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script><script src="https://cdn.tailwindcss.com"></script>
<style>body{font-family:Inter,system-ui,sans-serif;background:#f4f7fb}.card{background:#fff;border:1px solid #e2e8f0;border-radius:20px;box-shadow:0 10px 30px rgba(15,23,42,.06)}.thumb{width:90px;height:90px;object-fit:cover;border-radius:12px;border:1px solid #ddd}</style>
</head><body><div class="max-w-6xl mx-auto px-4 py-7">
<h1 class="text-3xl font-black text-blue-900">🔄 Controle Flash Trocas</h1><p class="text-slate-500 mb-6">Avalie, atualize e envie o acompanhamento ao cliente.</p>
<div id="lista" class="space-y-4">Carregando...</div></div>
<script>
const db=window.supabase.createClient('https://rgcclordmqjmwuzrrfbd.supabase.co','sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi');
const money=v=>v==null||v===''?'A definir':Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
function nums(v){return String(v||'').replace(/\D/g,'')}
function wpp(d){const n=nums(d.telefone);if(n.length<10)return alert('WhatsApp inválido.');const link=location.origin+location.pathname.replace(/painel-trocas\.html.*$/,'')+'consultar-troca.html?codigo='+encodeURIComponent(d.codigo);const msg=`Olá ${d.nome||'cliente'}! Sua solicitação Flash Trocas foi registrada.\n\n🆔 Código: ${d.codigo}\n\n📲 Acompanhe aqui:\n${link}`;window.open('https://wa.me/55'+n+'?text='+encodeURIComponent(msg),'_blank')}
async function load(){const {data,error}=await db.from('flash_trocas').select('*').order('created_at',{ascending:false});if(error){lista.innerHTML='<div class="card p-5 text-red-600">Erro: '+error.message+'</div>';return}lista.innerHTML=(data||[]).map(d=>{let fotos=d.fotos||[];if(typeof fotos==='string'){try{fotos=JSON.parse(fotos)}catch(e){fotos=fotos.split(',').filter(Boolean)}}return `<div class="card p-5"><div class="flex flex-wrap justify-between gap-3"><div><h2 class="font-black text-xl">${d.nome||'-'}</h2><div class="text-sm text-slate-500">🆔 ${d.codigo||d.id} • 📱 ${d.telefone||'-'}</div><div class="mt-2 font-bold">${d.tipo_equipamento||'-'} ${d.marca||''} ${d.modelo||''}</div></div><select id="s_${d.id}" class="border rounded-xl px-3 py-2"><option ${d.status==='Nova'?'selected':''}>Nova</option><option ${d.status==='Em avaliação'?'selected':''}>Em avaliação</option><option ${d.status==='Aprovada'?'selected':''}>Aprovada</option><option ${d.status==='Negociação'?'selected':''}>Negociação</option><option ${d.status==='Concluída'?'selected':''}>Concluída</option><option ${d.status==='Recusada'?'selected':''}>Recusada</option></select></div>
<div class="mt-4 flex gap-2 overflow-x-auto">${fotos.map(u=>`<a href="${u}" target="_blank"><img src="${u}" class="thumb"></a>`).join('')||'<span class="text-sm text-slate-500">Sem fotos.</span>'}</div>
<div class="grid md:grid-cols-3 gap-3 mt-4"><input id="v_${d.id}" type="number" step=".01" value="${d.valor_avaliado??''}" placeholder="Valor avaliado" class="border rounded-xl px-3 py-2"><input id="m_${d.id}" type="number" step=".01" value="${d.saldo_negociacao??''}" placeholder="Saldo" class="border rounded-xl px-3 py-2"><input id="o_${d.id}" value="${(d.observacao||d.observacoes||'').replace(/"/g,'&quot;')}" placeholder="Observação" class="border rounded-xl px-3 py-2"></div>
<div class="flex flex-wrap gap-2 mt-4"><button onclick="salvar('${d.id}')" class="bg-blue-700 text-white font-bold rounded-xl px-4 py-2">💾 Salvar</button><button onclick='wpp(${JSON.stringify(d).replace(/'/g,"&#39;")})' class="bg-green-600 text-white font-bold rounded-xl px-4 py-2">📲 Enviar link pelo WhatsApp</button><a href="consultar-troca.html?codigo=${encodeURIComponent(d.codigo||'')}" target="_blank" class="bg-slate-800 text-white font-bold rounded-xl px-4 py-2">👁️ Ver cliente</a></div></div>`}).join('')}
async function salvar(id){const status=document.getElementById('s_'+id).value, valor=document.getElementById('v_'+id).value, saldo=document.getElementById('m_'+id).value, obs=document.getElementById('o_'+id).value;const {error}=await db.from('flash_trocas').update({status,valor_avaliado:valor===''?null:Number(valor),saldo_negociacao:saldo===''?null:Number(saldo),observacao:obs}).eq('id',id);if(error)alert(error.message);else alert('Atualizado com sucesso.');}
load();
</script></body></html>
