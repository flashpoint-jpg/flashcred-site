<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071b4d">
<title>FlashCred — Em manutenção</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(145deg,#061633,#0A2463 55%,#0F8B8D);color:#fff;display:grid;place-items:center;padding:24px}
.card{width:min(560px,100%);text-align:center;padding:42px 26px;border:1px solid rgba(255,255,255,.16);border-radius:28px;background:rgba(255,255,255,.08);box-shadow:0 30px 90px rgba(0,0,0,.25);backdrop-filter:blur(12px)}
.logo{font-size:34px;font-weight:900;letter-spacing:-1px}.logo span{color:#5eead4}
.badge{display:inline-block;margin:22px 0 14px;padding:8px 14px;border-radius:999px;background:rgba(94,234,212,.13);border:1px solid rgba(94,234,212,.3);color:#99f6e4;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
h1{font-size:clamp(28px,7vw,42px);margin:4px 0 12px;line-height:1.08}p{margin:0 auto;max-width:420px;color:#dbeafe;font-size:16px;line-height:1.6}
.status{margin:26px auto 0;width:64px;height:6px;border-radius:99px;background:#5eead4;box-shadow:0 0 24px rgba(94,234,212,.55)}
small{display:block;margin-top:28px;color:#93c5d5}
</style>
</head>
<body>
<main class="card">
<div class="logo">Flash<span>Cred</span></div>
<div class="badge">Atualização do sistema</div>
<h1>Estamos em manutenção</h1>
<p>Estamos realizando melhorias no FlashCred. O sistema ficará temporariamente indisponível e voltará em breve.</p>
<div class="status"></div>
<small>Distribuidora Flash Point</small>
</main>
</body>
</html>
